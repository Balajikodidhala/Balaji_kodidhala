<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Balaji profile background</title>
  <desc id="desc">Colorful abstract background with blue, violet, and teal flowing shapes.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12002F"/>
      <stop offset="0.45" stop-color="#3D1A78"/>
      <stop offset="1" stop-color="#006B73"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4B91" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00C9A7" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2575FC" stop-opacity=".7"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="280" fill="url(#base)"/>
  <circle cx="1050" cy="40" r="180" fill="url(#pink)" filter="url(#blur)"/>
  <circle cx="160" cy="260" r="190" fill="url(#cyan)" filter="url(#blur)"/>
  <path d="M0 215 C190 125 300 305 490 205 S820 90 1200 180 L1200 280 L0 280Z" fill="#00C9A7" opacity=".23"/>
  <path d="M0 65 C220 165 355 -5 575 72 S900 175 1200 55 L1200 0 L0 0Z" fill="#FF4B91" opacity=".2"/>
  <g fill="none" stroke="#ffffff" opacity=".22">
    <circle cx="970" cy="150" r="76" stroke-width="2"/>
    <circle cx="970" cy="150" r="106" stroke-width="1"/>
    <circle cx="220" cy="85" r="45" stroke-width="2"/>
  </g>
  <text x="600" y="138" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">BALAJI KODIDHALA</text>
  <text x="600" y="178" fill="#D9FFF7" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">DATA · DESIGN · DEVELOPMENT</text>
</svg>
